schema_version: 1

agent:
  enabled: true
  mode: hybrid
  speech_enabled: false
  feedback_cooldown_s: 2.0
  thresholds:
    tracking_error_high_m: 0.030
    tracking_error_good_m: 0.012
    interaction_force_high_n: 0.40
    task_speed_fast: 0.25
    task_speed_slow: 0.01
    human_power_low_w: 0.001
    inactivity_duration_s: 1.0
    fatigue_high: 0.65
  hardware_validation_required: true
  llm:
    enabled: true
    provider: deepseek
    base_url: https://api.deepseek.com
    model: deepseek-chat
    api_key_env: DEEPSEEK_API_KEY
    timeout_s: 20.0
    event_enrichment_enabled: true
    event_enrichment_cooldown_s: 15.0
    summary_enabled: true
    chat_enabled: true
    max_history_messages: 20
