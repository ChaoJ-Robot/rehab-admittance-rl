schema_version: 1

tasks:
  point_to_point:
    target_distance: 0.15       # m, simulation placeholder
    target_radius: 0.025        # m
    reference_speed: 0.05       # m/s
    task_duration: 4.0          # s
  circle_tracking:
    path_radius: 0.08           # m, simulation placeholder
    reference_speed: 0.10       # m/s
    path_width: 0.025           # m
    task_duration: 8.0          # s
  figure8_tracking:
    path_width: 0.12            # m, simulation placeholder
    reference_speed: 0.10       # m/s
    path_width_tolerance: 0.03  # m
    task_duration: 8.0          # s
  maze_navigation:
    reference_speed: 0.14       # m/s along the maze corridor path
    task_duration: 8.0          # s
  color_memory:
    sequence_length: 4          # number of colour blocks to memorise
    memorize_duration: 3.0      # s of the memorise phase
    task_duration: 10.0         # s
