[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-admittance-rehab"
version = "0.1.0"
description = "Safe RL adaptive admittance training system for a planar 3-DoF rehabilitation robot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "mujoco>=3.1.0",
    "numpy>=1.24",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
    "matplotlib>=3.7",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=7.4",
    "ruff>=0.6.0",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rehab_sim*", "scripts*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["rehab_sim", "scripts", "backend", "tests"]
extend-exclude = ["build", "install", "log", "ros2_ws/build", "ros2_ws/install", "ros2_ws/log"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
packages = ["rehab_sim", "scripts", "backend"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
